name: F1 Diagnostics (isolated)

on:
  push:
    branches:
      - docs/roadmap-issues-3873-3874
    paths:
      - .github/workflows/f1-diagnostics.yml
      - scripts/diagnostics/pcobra_f1_repro.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-f1:
    name: F1 reproduction (Ubuntu Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout diagnostic tools (branch)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Checkout exact historical baseline (read only)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: 68e0465d3793078f2c7763f1e51f7748eb8e9f60
          path: _f1_baseline
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check collector syntax and fixed baseline
        shell: bash
        run: |
          bash -n scripts/diagnostics/pcobra_f1_repro.sh
          test "$(git -C _f1_baseline rev-parse HEAD)" = 68e0465d3793078f2c7763f1e51f7748eb8e9f60
      - name: Install baseline in isolated runner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./_f1_baseline
          python -m pip check
      - name: Run F1 probes and keep genuine exit codes
        id: probes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pcobra-f1-evidence"
          bash scripts/diagnostics/pcobra_f1_repro.sh \
            "$GITHUB_WORKSPACE/_f1_baseline" \
            "$RUNNER_TEMP/pcobra-f1-evidence"
          cat "$RUNNER_TEMP/pcobra-f1-evidence/RESULTS.txt"
      - name: Upload raw evidence (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcobra-f1-ubuntu-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pcobra-f1-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize results without claiming functional success
        if: always()
        shell: bash
        run: |
          {
            echo "## F1 — Python ${{ matrix.python-version }}"
            echo "Commit base: \`68e0465d3793078f2c7763f1e51f7748eb8e9f60\`"
            echo "Probe step: \`${{ steps.probes.outcome }}\`"
            echo "Evidence artifact: \`pcobra-f1-ubuntu-py${{ matrix.python-version }}\`"
            if [[ -f "$RUNNER_TEMP/pcobra-f1-evidence/RESULTS.txt" ]]; then
              echo '### Raw process exit codes'
              echo '~~~text'
              cat "$RUNNER_TEMP/pcobra-f1-evidence/RESULTS.txt"
              echo '~~~'
            else
              echo "No executed probes; inspect install/setup logs."
            fi
            echo "An Actions green status is not proof that R01-R06 all passed."
          } >> "$GITHUB_STEP_SUMMARY"
