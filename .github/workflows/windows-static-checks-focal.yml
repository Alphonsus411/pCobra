name: Windows static checks focal

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/windows-static-checks-focal.yml'
  push:
    branches:
      - fix/windows-smoke-utf8-console
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project dependencies
        uses: ./.github/actions/install
        with:
          extra: "pyright"
      - name: Run canonical lint checks (Windows)
        shell: pwsh
        run: |
          python -m pip install bandit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruff check src/pcobra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mypy src/pcobra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bandit -r src/pcobra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run canonical type checks (Windows)
        shell: pwsh
        run: |
          mypy src/pcobra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
