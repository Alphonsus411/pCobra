name: Windows smoke UTF-8 focal

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/windows-smoke-utf8-focal.yml'
  push:
    branches:
      - fix/windows-smoke-utf8-console
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-utf8-stdout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify Unicode smoke banner with CI encoding
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import ast
          import pathlib
          import sys

          script = pathlib.Path("scripts/smoke_transpilers_syntax.py")
          tree = ast.parse(script.read_text(encoding="utf-8"))
          banners = [
              node.args[0].value
              for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == "print"
              and node.args
              and isinstance(node.args[0], ast.Constant)
              and isinstance(node.args[0].value, str)
              and any(ord(char) > 127 for char in node.args[0].value)
          ]
          assert banners, "No Unicode smoke banners found"
          assert sys.stdout.encoding.lower().replace("-", "") == "utf8", sys.stdout.encoding
          for banner in banners:
              print(banner)
          '@ | python -
