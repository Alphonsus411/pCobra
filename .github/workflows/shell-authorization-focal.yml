name: Shell authorization focal regression

on:
  push:
    branches:
      - test/process-shell-authorization-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-authorization:
    name: Shell authorization (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install "pytest>=8.2,<9"
      - name: Run focal regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/unit/test_proceso_shell_authorization_regression.py
