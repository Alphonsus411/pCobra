name: Windows UTF-8 syntax smoke (isolated)

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/windows-utf8-syntax-smoke-isolated.yml'
      - 'scripts/smoke_syntax.py'
      - 'scripts/smoke_transpilers_syntax.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-utf8-syntax-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Python project dependencies
        uses: ./.github/actions/install
      - name: Run canonical syntax smoke scripts with UTF-8 stdout
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import sys; assert sys.stdout.encoding.lower().replace('-', '') == 'utf8', sys.stdout.encoding"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_syntax.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_transpilers_syntax.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
